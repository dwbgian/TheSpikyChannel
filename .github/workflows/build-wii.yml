name: Build Wii Homebrew

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build core and forwarder
    runs-on: ubuntu-latest

    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITPPC: /opt/devkitpro/devkitPPC
      DEVKITPRO_IMAGE: devkitpro/devkitppc:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pull devkitPro toolchain image
        run: |
          set -euo pipefail
          docker pull "${DEVKITPRO_IMAGE}"

      - name: Build Spiky core and forwarder
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${PWD}:/workspace" \
            -w /workspace \
            -e DEVKITPRO="${DEVKITPRO}" \
            -e DEVKITPPC="${DEVKITPPC}" \
            "${DEVKITPRO_IMAGE}" \
            bash -lc '
              set -euo pipefail
              for attempt in 1 2 3 4 5; do
                if dkp-pacman -Sy --needed --noconfirm wii-dev devkitPPC libogc libfat-ogc; then
                  break
                fi
                if [ "${attempt}" = "5" ]; then
                  echo "devkitPro package refresh failed; continuing with packages already in ${DEVKITPRO_IMAGE}."
                  break
                fi
                sleep 15
              done
              export PATH="${DEVKITPRO}/tools/bin:${DEVKITPPC}/bin:${PATH}"
              echo "DEVKITPRO=${DEVKITPRO}"
              echo "DEVKITPPC=${DEVKITPPC}"
              powerpc-eabi-gcc --version
              powerpc-eabi-gcc -print-sysroot || true
              make
              make -C forwarder hbc
            '

      - name: Validate build output
        run: |
          set -euo pipefail
          test -f boot.dol
          test -f forwarder/apps/the_spiky_channel/boot.dol
          test -f forwarder/apps/the_spiky_channel/meta.xml
          echo "Spiky core:"
          wc -c boot.dol
          sha256sum boot.dol
          echo "Spiky forwarder:"
          ls -lah forwarder/apps/the_spiky_channel
          wc -c forwarder/apps/the_spiky_channel/boot.dol
          sha256sum forwarder/apps/the_spiky_channel/boot.dol

      - name: Create Homebrew Channel ZIP
        run: |
          set -euo pipefail
          mkdir -p dist/hbc/apps
          cp -R forwarder/apps/the_spiky_channel dist/hbc/apps/
          cd dist/hbc
          zip -r ../../TheSpikyChannel-HBC.zip apps/the_spiky_channel
          cd ../..
          unzip -l TheSpikyChannel-HBC.zip

      - name: Create USB core ZIP
        run: |
          set -euo pipefail
          mkdir -p dist/usb/spiky/core
          cp boot.dol dist/usb/spiky/core/boot.dol
          cd dist/usb
          zip -r ../../TheSpikyChannel-USB-Core.zip spiky
          cd ../..
          unzip -l TheSpikyChannel-USB-Core.zip

      - name: Create direct Homebrew Channel test ZIP
        run: |
          set -euo pipefail
          mkdir -p dist/direct-hbc/apps/the_spiky_channel
          cp boot.dol dist/direct-hbc/apps/the_spiky_channel/boot.dol
          cp apps/the_spiky_channel/meta.xml dist/direct-hbc/apps/the_spiky_channel/meta.xml
          if [ -f apps/the_spiky_channel/icon.png ]; then
            cp apps/the_spiky_channel/icon.png dist/direct-hbc/apps/the_spiky_channel/icon.png
          fi
          cd dist/direct-hbc
          zip -r ../../TheSpikyChannel-Direct-HBC-Test.zip apps/the_spiky_channel
          cd ../..
          unzip -l TheSpikyChannel-Direct-HBC-Test.zip

      - name: Upload Homebrew Channel folder
        uses: actions/upload-artifact@v4
        with:
          name: the-spiky-channel-hbc
          path: dist/hbc/
          if-no-files-found: error

      - name: Upload Homebrew Channel ZIP
        uses: actions/upload-artifact@v4
        with:
          name: TheSpikyChannel-HBC.zip
          path: TheSpikyChannel-HBC.zip
          if-no-files-found: error

      - name: Upload USB core ZIP
        uses: actions/upload-artifact@v4
        with:
          name: TheSpikyChannel-USB-Core.zip
          path: TheSpikyChannel-USB-Core.zip
          if-no-files-found: error

      - name: Upload direct Homebrew Channel test ZIP
        uses: actions/upload-artifact@v4
        with:
          name: TheSpikyChannel-Direct-HBC-Test.zip
          path: TheSpikyChannel-Direct-HBC-Test.zip
          if-no-files-found: error
